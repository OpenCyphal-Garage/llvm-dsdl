name: Toolchain relabel

# Re-stamps the published toolchain images with the current inputs hash, without
# rebuilding them.
#
# ⚠️ Only run this when the published images are known to be byte-equivalent to
# what the current configuration would produce. It asserts equivalence; it does
# not check it. Running it after a real flag change would mark a stale image as
# current and defeat the rebuild guard in toolchain.yml entirely.
#
# It exists for one narrow case: the *hashing scheme* changed while the images
# did not. That happened once -- the guard originally hashed build_llvm.py's file
# bytes rather than its effective flags, so a comment, or a flag only macOS
# passes, invalidated four Linux images that could not have been affected.
# Rebuilding them would have cost about seventy minutes each; this costs minutes.
#
# Deliberately a separate workflow with its own trigger, so that editing it does
# not start a toolchain build, and so that nothing runs it by accident.

on:
  push:
    paths:
      - .github/workflows/toolchain-relabel.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  relabel:
    name: Relabel ${{ matrix.flavour }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: musl
            dockerfile: packaging/docker/Dockerfile.llvm-toolchain
            arch: amd64
          - flavour: musl
            dockerfile: packaging/docker/Dockerfile.llvm-toolchain
            arch: arm64
          - flavour: glibc
            dockerfile: packaging/docker/Dockerfile.llvm-toolchain-glibc
            arch: amd64
          - flavour: glibc
            dockerfile: packaging/docker/Dockerfile.llvm-toolchain-glibc
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Relabel
        # The same hash toolchain.yml computes, from the same inputs, so the two
        # cannot disagree about what "current" means.
        run: |
          set -euo pipefail
          ref="$(grep -v '^#' packaging/toolchain/llvm.pin | tr -d '[:space:]')"
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          tag="ghcr.io/${owner}/llvm-dsdl-toolchain:${{ matrix.flavour }}-${{ matrix.arch }}-${ref}"

          want="$( { cat packaging/toolchain/llvm.pin "${{ matrix.dockerfile }}"
                     python3 packaging/toolchain/build_llvm.py --print-config
                   } | sha256sum | cut -c1-16)"

          have="$(docker buildx imagetools inspect "$tag" \
                    --format '{{ if .Image.Config.Labels }}{{ index .Image.Config.Labels "org.opencyphal.llvm-dsdl.inputs" }}{{ end }}' \
                  2>/dev/null || true)"

          if [ "$have" = "$want" ]; then
            echo "$tag already carries ${want}; nothing to do"
            exit 0
          fi
          if ! docker pull --platform "linux/${{ matrix.arch }}" "$tag"; then
            echo "::notice::$tag is not published; toolchain.yml will build it"
            exit 0
          fi

          echo "relabelling $tag: ${have:-<none>} -> ${want}"
          # A LABEL-only layer on top of the existing image. Nothing is compiled
          # and no file changes; the layers are already in the registry, so the
          # push uploads almost nothing.
          printf 'FROM %s\nLABEL org.opencyphal.llvm-dsdl.inputs=%s\n' "$tag" "$want" > Dockerfile.relabel
          docker build --platform "linux/${{ matrix.arch }}" -f Dockerfile.relabel -t "$tag" .
          docker push "$tag"

      - name: Confirm
        run: |
          set -euo pipefail
          ref="$(grep -v '^#' packaging/toolchain/llvm.pin | tr -d '[:space:]')"
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          tag="ghcr.io/${owner}/llvm-dsdl-toolchain:${{ matrix.flavour }}-${{ matrix.arch }}-${ref}"
          docker buildx imagetools inspect "$tag" \
            --format '{{ if .Image.Config.Labels }}{{ index .Image.Config.Labels "org.opencyphal.llvm-dsdl.inputs" }}{{ end }}'
