name: CI

# Full, unabridged test + report run for the core tools (dsdlc, dsdl-opt, dsdld)
# across every supported host platform and every generated-output language.
#
# The container jobs run INSIDE the project's own toolshed image
# (ghcr.io/opencyphal/toolshed:ts26.4.2 — the same image .devcontainer uses). That
# image is the single source of truth for the build environment: LLVM/MLIR 22,
# clang, cmake, ninja, the generated-output language toolchains, and Dafny with
# its solver all come from it. Nothing is installed per run; the setup action
# asserts the toolchains are present and fails loudly if one is missing, because
# the integration suite registers a language's tests only when its toolchain is
# found at configure time — so a silently incomplete image sheds whole lanes
# while still reporting green.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  linux:
    name: Full suite (linux / toolshed)
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/opencyphal/toolshed:ts26.4.2
    timeout-minutes: 120
    env:
      LLVM_DIR: /usr/lib/llvm-22/lib/cmake/llvm
      MLIR_DIR: /usr/lib/llvm-22/lib/cmake/mlir
      CMAKE_PREFIX_PATH: /usr/lib/llvm-22
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare toolchains
        uses: ./.github/actions/setup-language-toolchains

      - name: Provision peer DSDL compiler for corroboration (nunavut + pydsdl)
        # The differential parity lane compares our generated C against Nunavut as a
        # pinned PEER implementation — corroboration, not an oracle. The Cyphal
        # Specification is the truth and spec/dafny/CyphalSerdes.dfy is the
        # machine-checked oracle (see its Authority hierarchy); a mismatch here is an
        # investigation adjudicated by the spec, as likely a Nunavut defect as ours.
        # With the SHAs pinned, a newly appearing mismatch implicates our change
        # first, which is what makes this lane a useful blocking tripwire. The
        # harness consumes both repos as source trees via PYTHONPATH — nunavut
        # vendors Jinja2 and pydsdl has no runtime deps, so no pip install is
        # needed. Bump both SHAs only as a deliberate, adjudicated update.
        env:
          NUNAVUT_SHA: 37095abb9fac47f924a52500bf4cebe2256dcff5  # tag 3.0.1b1
          PYDSDL_SHA: a1506ce424589cc049b3fe4fece1e52626b55529   # pydsdl 1.23.0-dev
        run: |
          git clone --filter=blob:none https://github.com/OpenCyphal/nunavut.git .reference/nunavut
          git -C .reference/nunavut checkout --detach "${NUNAVUT_SHA}"
          git clone --filter=blob:none https://github.com/OpenCyphal/pydsdl.git .reference/pydsdl
          git -C .reference/pydsdl checkout --detach "${PYDSDL_SHA}"

      - name: Configure (ci preset)
        # LLVMDSDL_REPORT_GATE_JUNIT makes the parity/malformed/determinism report gates
        # BEHAVIORAL: a matrix cell is covered only if a matching test executed and passed
        # (consumed from the suite's --output-junit below), not merely registered by name.
        # LLVMDSDL_REQUIRE_DIFFERENTIAL_PARITY=ON turns a missing nunavut/pydsdl into a hard
        # configure error, so a green CI run can never mean the reference-parity lane was
        # silently skipped.
        run: |
          cmake --preset ci \
            -DLLVM_DIR="${LLVM_DIR}" -DMLIR_DIR="${MLIR_DIR}" \
            -DLLVMDSDL_REPORT_GATE_JUNIT="${GITHUB_WORKSPACE}/test-results/junit-linux.xml" \
            -DLLVMDSDL_NUNAVUT_REPO="${GITHUB_WORKSPACE}/.reference/nunavut" \
            -DLLVMDSDL_PYDSDL_REPO="${GITHUB_WORKSPACE}/.reference/pydsdl" \
            -DLLVMDSDL_REQUIRE_DIFFERENTIAL_PARITY=ON

      - name: Build (Debug)
        run: cmake --build --preset build-ci

      - name: Hash generated corpus (libstdc++ side of the cross-stdlib determinism gate)
        # One half of the P1 "two-toolchain" determinism check: this dsdlc links the
        # distro LLVM/libstdc++ on x86-64; the cross-stdlib job produces the
        # libc++/arm64 half and the cross-stdlib-determinism job compares them.
        run: |
          llvm_ver="$(/usr/lib/llvm-22/bin/llvm-config --version)"
          python3 tools/determinism/cross_stdlib_corpus_hash.py \
            --dsdlc build/matrix/ci/tools/dsdlc/Debug/dsdlc \
            --dsdl-root submodules/public_regulated_data_types/uavcan \
            --out corpus-hash-libstdcxx.json \
            --label libstdc++ \
            --meta "llvm=${llvm_ver}"

      - name: Upload corpus hash (libstdc++)
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: corpus-hash-libstdcxx
          path: corpus-hash-libstdcxx.json

      - name: Build Python runtime accelerator
        run: cmake --build build/matrix/ci --config Debug --target build-python-runtime-accelerator

      - name: Run full unabridged test suite
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/test-results"
          ctest --preset test-ci-full \
            --output-junit "${GITHUB_WORKSPACE}/test-results/junit-linux.xml"

      - name: Behavioral scorecard gates (convergence lint + parity/malformed/determinism pass-fail)
        # Runs after the suite so it can consume the executed JUnit results. `if: always()`
        # ensures the gate still runs (and can fail the job) even if an earlier test failed.
        if: always()
        run: cmake --build build/matrix/ci --config Debug --target release-blocking-report-gates

      - name: Collect reports
        if: always()
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/reports"
          [ -d build/matrix/ci/convergence ] && cp -R build/matrix/ci/convergence "${GITHUB_WORKSPACE}/reports/" || true

      # GitHub-only reporting: skipped under `act` (which sets ACT=true) so local
      # runs don't hit the GitHub API or need an artifact server.
      - name: Publish test results
        if: ${{ always() && !env.ACT }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "test-results/junit-linux.xml"
          check_name: "Test results (linux)"
          include_passed: true
          detailed_summary: true
          fail_on_failure: false

      - name: Upload JUnit results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-linux
          path: test-results/junit-linux.xml
          if-no-files-found: warn

      - name: Upload reports
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-linux
          path: reports/
          if-no-files-found: warn

  sanitizers:
    name: Native decoder sanitizers + fuzzing (linux / toolshed)
    # ASan/UBSan over the generated C/C++/Go decoders plus a coverage-guided
    # libFuzzer lane over the native deserializers on the real UAVCAN corpus.
    # Linux-only: threading the ASan runtime into a Go external link is only
    # reliable here, and macOS Apple-Silicon ASan startup is flaky. The lane is
    # bounded on PRs (short -runs) and runs deep on the weekly schedule cron.
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/opencyphal/toolshed:ts26.4.2
    timeout-minutes: 120
    env:
      LLVM_DIR: /usr/lib/llvm-22/lib/cmake/llvm
      MLIR_DIR: /usr/lib/llvm-22/lib/cmake/mlir
      CMAKE_PREFIX_PATH: /usr/lib/llvm-22
      # The sanitizer + fuzz harnesses require Clang (-fsanitize=address,undefined
      # and compiler-rt libFuzzer); force it so the Clang-gated tests register and
      # the generated decoders are compiled with the sanitizer toolchain.
      CC: /usr/lib/llvm-22/bin/clang
      CXX: /usr/lib/llvm-22/bin/clang++
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare toolchains
        # Go is needed for the C/Go sanitized parity variant; the MLIR dev libs
        # are needed to build dsdlc.
        uses: ./.github/actions/setup-language-toolchains

      - name: Configure (ci-asan preset)
        # A short fuzz budget on PRs keeps the lane fast; the weekly schedule cron
        # runs a deep budget. libFuzzer support is auto-probed by the harness,
        # which falls back to an ASan/UBSan corpus replay if it is absent.
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            FUZZ_RUNS=4000000
          else
            FUZZ_RUNS=40000
          fi
          cmake --preset ci-asan \
            -DLLVM_DIR="${LLVM_DIR}" -DMLIR_DIR="${MLIR_DIR}" \
            -DLLVMDSDL_NATIVE_DECODER_FUZZ_RUNS="${FUZZ_RUNS}"

      - name: Build dsdlc (sanitizer toolchain)
        # The sanitizer/fuzz tests are CMake scripts that only drive dsdlc; they
        # compile the generated decoders themselves under sanitizers, so only
        # dsdlc needs building here.
        run: cmake --build build/matrix/ci-asan --config Debug --target dsdlc

      - name: Run sanitizer + native-decoder fuzz lane
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/test-results"
          ctest --preset test-ci-asan-sanitizer \
            --output-junit "${GITHUB_WORKSPACE}/test-results/junit-sanitizers.xml"

      - name: Collect fuzz reproducers
        # Any crash/leak/timeout reproducer libFuzzer saved becomes a CI artifact
        # so a maintainer can add it to test/fuzz/corpus/native_decoder/.
        if: always()
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/fuzz-artifacts"
          find build/matrix/ci-asan -type d -name artifacts -path '*native-decoder-fuzz*' \
            -exec cp -R {}/. "${GITHUB_WORKSPACE}/fuzz-artifacts/" \; 2>/dev/null || true

      - name: Publish test results
        if: ${{ always() && !env.ACT }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "test-results/junit-sanitizers.xml"
          check_name: "Test results (sanitizers)"
          include_passed: true
          detailed_summary: true
          fail_on_failure: false

      - name: Upload fuzz reproducers
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-reproducers
          path: fuzz-artifacts/
          if-no-files-found: ignore

  formal-model:
    name: Formal model check (Dafny)
    # spec/dafny/CyphalSerdes.dfy is the normative oracle for the emit-order verifier:
    # it PROVES (unbounded, by induction) that serialize/deserialize round-trip and that
    # the read path is bounds-safe by construction, and defines the accepted op orderings
    # the B1 verifier checks each generated backend against. Re-verified on every change
    # so the oracle can't rot. Needs only the Dafny toolchain — independent of the
    # LLVM/MLIR build matrix, so it is fast and cannot be skipped by a toolchain gap in
    # the heavy lanes.
    runs-on: ubuntu-26.04
    # Dafny and its solver come from the toolshed image rather than being fetched
    # per run.
    container:
      image: ghcr.io/opencyphal/toolshed:ts26.4.2
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assert the Dafny toolchain
        # Deliberately not the shared toolchain action: this lane is independent of
        # the LLVM/MLIR build matrix and must not be taken down by a Go or
        # TypeScript gap. It needs exactly two things, and Dafny's NuGet package
        # ships no solver, so a `dafny` that launches proves nothing on its own.
        #
        # `shell: bash` is required, not decorative: a container job without it
        # runs steps under sh, where the array syntax below is a syntax error.
        shell: bash
        run: |
          set -uo pipefail
          missing=()
          for tool in dafny z3; do
            command -v "${tool}" >/dev/null 2>&1 || missing+=("${tool}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::toolshed image is missing: ${missing[*]} — these belong in the image"
            exit 1
          fi
          dafny --version
          z3 --version

      - name: Verify CyphalSerdes
        # `dafny verify` exits non-zero on any failed proof obligation, so a broken model
        # (or a regression to the accepted op-orderings) fails the job.
        run: dafny verify spec/dafny/CyphalSerdes.dfy

  cross-stdlib:
    name: Corpus generation (macOS / libc++ / arm64)
    # The libc++ half of the P1 "two-toolchain" determinism gate. libstdc++ and
    # libc++ implement different std::hash functions and bucket policies, so a
    # future code path that lets std::unordered_* iteration order leak into
    # emitted text diverges between this job's output and the linux job's —
    # exactly the nondeterminism class that same-host env perturbation
    # (locale/TZ/PYTHONHASHSEED, already gated) cannot expose. Builds dsdlc only.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install LLVM/MLIR + ninja (Homebrew; links libc++)
        # Pin to the toolshed image's LLVM major (ts26.4.2 -> 22) so the C backend
        # (routed through MLIR/EmitC, whose text may vary across MLIR majors) stays
        # comparable. Prefer the versioned formula; fall back to `llvm` (which IS 22
        # while 22 is current). The assertion below is the real pin: a Homebrew
        # major bump fails this job loudly instead of silently eroding C coverage —
        # bump this pin and the toolshed image together, deliberately.
        run: brew install ninja && (brew install llvm@22 || brew install llvm)

      - name: Assert LLVM major matches the linux (toolshed) side
        run: |
          LLVM_PREFIX="$(brew --prefix llvm@22 2>/dev/null || true)"
          [ -x "${LLVM_PREFIX}/bin/llvm-config" ] || LLVM_PREFIX="$(brew --prefix llvm)"
          ver="$("${LLVM_PREFIX}/bin/llvm-config" --version)"
          echo "Homebrew LLVM: ${ver} at ${LLVM_PREFIX}"
          if [ "${ver%%.*}" != "22" ]; then
            echo "::error::Homebrew LLVM major (${ver%%.*}) != toolshed LLVM major (22)." \
                 "Bump the llvm@ pin here and the toolshed image together." >&2
            exit 1
          fi
          echo "LLVM_PREFIX=${LLVM_PREFIX}" >> "${GITHUB_ENV}"

      - name: Configure (dev-llvm-env preset, Homebrew LLVM)
        run: |
          export LLVM_DIR="${LLVM_PREFIX}/lib/cmake/llvm"
          export MLIR_DIR="${LLVM_PREFIX}/lib/cmake/mlir"
          cmake --preset dev-llvm-env

      - name: Build dsdlc
        run: cmake --build --preset build-dev-llvm-env --target dsdlc

      - name: Assert libc++ linkage (the point of this lane)
        run: |
          dsdlc="$(find build/matrix/dev-llvm-env/tools/dsdlc -name dsdlc -type f -perm +111 | head -1)"
          otool -L "${dsdlc}"
          otool -L "${dsdlc}" | grep -q 'libc++'

      - name: Hash generated corpus (libc++ side)
        run: |
          dsdlc="$(find build/matrix/dev-llvm-env/tools/dsdlc -name dsdlc -type f -perm +111 | head -1)"
          llvm_ver="$("${LLVM_PREFIX}/bin/llvm-config" --version)"
          python3 tools/determinism/cross_stdlib_corpus_hash.py \
            --dsdlc "${dsdlc}" \
            --dsdl-root submodules/public_regulated_data_types/uavcan \
            --out corpus-hash-libcxx.json \
            --label libc++ \
            --meta "llvm=${llvm_ver}"

      - name: Upload corpus hash (libc++)
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: corpus-hash-libcxx
          path: corpus-hash-libcxx.json

  cross-stdlib-determinism:
    name: Cross-stdlib determinism gate (libstdc++/x86-64 vs libc++/arm64)
    # Compares the two corpus-hash manifests byte-for-byte, all six backends
    # strictly: --require-c turns LLVM-major skew (which would otherwise skip the
    # MLIR/EmitC-routed C backend) into a hard failure, and the macOS job pins its
    # Homebrew LLVM to the toolshed's major, so skew can only happen through a
    # deliberate, mismatched bump — which this gate then catches. A mismatch means
    # generated output depends on the host toolchain — see
    # tools/determinism/cross_stdlib_corpus_hash.py.
    needs: [linux, cross-stdlib]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        if: ${{ !env.ACT }}
        uses: actions/checkout@v7

      - name: Download corpus hashes
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v8
        with:
          pattern: corpus-hash-*
          merge-multiple: true

      - name: Compare
        if: ${{ !env.ACT }}
        run: |
          python3 tools/determinism/cross_stdlib_corpus_hash.py \
            --compare corpus-hash-libstdcxx.json corpus-hash-libcxx.json \
            --require-c
