name: CI

# Lint, tier 0 on Linux and macOS, the docs build, and the golden-label check.
#
# The container jobs run INSIDE the project's own toolshed image
# (ghcr.io/opencyphal/toolshed, the same image .devcontainer uses), which
# supplies clang, cmake, ninja, python and Dafny with its solver.
#
# LLVM/MLIR does NOT come from that image. Every job that links it first
# restores the prefix pinned by packaging/toolchain/llvm.pin, so CI links the
# same LLVM the release ships rather than whichever one the image happened to
# carry. The Dafny job restores nothing; it proves a model and never touches LLVM.

on:
  push:
    branches: ["main"]
  pull_request:
    # `labeled` so that applying `shape-approved` re-evaluates the golden check then and there. A
    # re-run replays the original event payload, which does not carry the new label. Naming any
    # type replaces the default set, so the other three are restated.
    #
    # A label event says nothing about the code, so every lane but the golden check is guarded
    # with `github.event.action != 'labeled'`.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  # Label runs and code runs are different work on the same ref: a label run exists only to
  # re-evaluate the golden check, a code run proves the commit. Each kind supersedes only its own.
  group: "ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}"
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository hygiene (identity + committed paths)
    if: github.event.action != 'labeled'
    # Deliberately not in the toolshed container and deliberately first: this needs nothing but
    # python3 and a checkout, finishes in seconds, and tells a contributor that a URL or a home
    # directory is wrong long before the suite has finished pulling its image.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # No submodules: this checks what this repository commits, not what its dependencies do.
        uses: actions/checkout@v7

      - name: Check that every mention of where this project lives is current
        # Everything that names the owner is derived from project-identity.json. It also fails on
        # a committed /Users/<somebody>/ path, which is wrong for every other reader.
        run: python3 tools/repo_identity.py

  golden-label:
    name: Golden changes carry the shape-approved label
    # Runs on label events too: applying the label is how the check turns green.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (with history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check
        # AGENTS.md: a change to any file under test/golden/ merges only with the `shape-approved`
        # label, which only the project owner applies.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'shape-approved') }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_REF}"
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD" -- test/golden)"
          if [ -z "${changed}" ]; then
            echo "no golden changed"
            exit 0
          fi
          echo "goldens changed:"
          echo "${changed}"
          if [ "${APPROVED}" != "true" ]; then
            echo "::error::goldens changed without the shape-approved label"
            exit 1
          fi
          echo "shape-approved"

  lint:
    name: Lint (clang-format + clang-tidy)
    if: github.event.action != 'labeled'
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/opencyphal/toolshed:ts26.4.5
    # clang-tidy needs the configured Version.h, so this lane configures and builds before it can
    # analyse anything.
    timeout-minutes: 60
    env:
      LLVM_DIR: /opt/llvm-dsdl-toolchain/lib/cmake/llvm
      MLIR_DIR: /opt/llvm-dsdl-toolchain/lib/cmake/mlir
      CMAKE_PREFIX_PATH: /opt/llvm-dsdl-toolchain
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore the LLVM toolchain
        uses: ./.github/actions/restore-llvm-toolchain

      - name: Report the tool versions this run is pinned to
        # The ruleset is written against a major version: check names, their options, and what
        # clang-format does with a line all move between majors.
        run: |
          clang-format --version
          clang-tidy --version

      - name: Check that the clang-tidy ruleset says what it appears to say
        # clang-tidy globs the Checks scalar and silently drops whatever fails to match, so a
        # mistyped check name disables nothing. This makes it an error here.
        run: python3 tools/check_clang_tidy_config.py --config .clang-tidy

      - name: Check formatting
        # Runs before the configure: the script needs only the source tree, so a misformatted
        # patch fails in seconds rather than after the build below.
        run: |
          cmake -DCLANG_FORMAT="$(command -v clang-format)" \
                -DLLVMDSDL_SOURCE_DIR="${GITHUB_WORKSPACE}" \
                -P cmake/CheckClangFormat.cmake

      - name: Configure (ci preset)
        run: cmake --preset ci -DLLVM_DIR="${LLVM_DIR}" -DMLIR_DIR="${MLIR_DIR}"

      - name: Build (Debug)
        run: cmake --build --preset build-ci

      - name: Check source diagnostics
        run: cmake --build build/matrix/ci --config Debug --target check-clang-tidy

  linux:
    name: Tier 0 (linux / toolshed)
    if: github.event.action != 'labeled'
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/opencyphal/toolshed:ts26.4.5
    timeout-minutes: 60
    env:
      LLVM_DIR: /opt/llvm-dsdl-toolchain/lib/cmake/llvm
      MLIR_DIR: /opt/llvm-dsdl-toolchain/lib/cmake/mlir
      CMAKE_PREFIX_PATH: /opt/llvm-dsdl-toolchain
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore the LLVM toolchain
        uses: ./.github/actions/restore-llvm-toolchain

      - name: Configure (ci preset)
        run: cmake --preset ci -DLLVM_DIR="${LLVM_DIR}" -DMLIR_DIR="${MLIR_DIR}"

      - name: Build (Debug)
        run: cmake --build --preset build-ci

      - name: Run tier 0
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/test-results"
          ctest --preset test-ci-t0 \
            --output-junit "${GITHUB_WORKSPACE}/test-results/junit-linux.xml"

      - name: Every test ran
        # ctest counts a test that skipped as passed. A test that must skip in this job is allowed
        # by name with the reason, through `--allow NAME=REASON`.
        if: always()
        run: python3 tools/check_test_skips.py test-results/junit-linux.xml

      # GitHub-only reporting: skipped under `act` (which sets ACT=true).
      - name: Publish test results
        if: ${{ always() && !env.ACT }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "test-results/junit-linux.xml"
          check_name: "Test results (linux)"
          include_passed: true
          detailed_summary: true
          fail_on_failure: false

      - name: Upload JUnit results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-linux
          path: test-results/junit-linux.xml
          if-no-files-found: warn

  macos:
    name: Tier 0 (macOS / Homebrew LLVM)
    if: github.event.action != 'labeled'
    # GitHub-hosted: macOS cannot run the toolshed container. The versioned Homebrew formula is
    # the locked major; the configure step fails loudly if the two ever disagree.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install LLVM 22 and Ninja
        run: brew install llvm@22 ninja

      - name: Configure (ci preset)
        run: |
          prefix="$(brew --prefix llvm@22)"
          cmake --preset ci \
            -DLLVM_DIR="${prefix}/lib/cmake/llvm" \
            -DMLIR_DIR="${prefix}/lib/cmake/mlir"

      - name: Build (Debug)
        run: cmake --build --preset build-ci

      - name: Run tier 0
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/test-results"
          ctest --preset test-ci-t0 \
            --output-junit "${GITHUB_WORKSPACE}/test-results/junit-macos.xml"

      - name: Every test ran
        if: always()
        run: python3 tools/check_test_skips.py test-results/junit-macos.xml

      - name: Upload JUnit results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-macos
          path: test-results/junit-macos.xml
          if-no-files-found: warn

  docs:
    name: Docs build (strict)
    if: github.event.action != 'labeled'
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/opencyphal/toolshed:ts26.4.5
    timeout-minutes: 30
    env:
      LLVM_DIR: /opt/llvm-dsdl-toolchain/lib/cmake/llvm
      MLIR_DIR: /opt/llvm-dsdl-toolchain/lib/cmake/mlir
      CMAKE_PREFIX_PATH: /opt/llvm-dsdl-toolchain
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore the LLVM toolchain
        uses: ./.github/actions/restore-llvm-toolchain

      - name: Configure (ci preset)
        run: cmake --preset ci -DLLVM_DIR="${LLVM_DIR}" -DMLIR_DIR="${MLIR_DIR}"

      - name: Generate the pages that are produced rather than written
        run: cmake --build build/matrix/ci --config Debug --target docs-generate

      - name: Build the docs site (strict)
        # The nav is the page map, and `--strict` is what makes that true: an unfiled page, a broken
        # cross-reference, or a nav entry with no page behind it fails here. A virtual environment
        # because the image ships its own mkdocs at distro versions and its Python is PEP 668
        # externally-managed.
        #
        # The mermaid check is separate because `--strict` cannot see that failure: the markdown is
        # valid and the page builds, but the diagram becomes a red error card in the reader's
        # browser.
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/pip install --quiet --upgrade pip
          .venv-docs/bin/pip install --quiet -r docs/requirements.txt
          .venv-docs/bin/mkdocs build --strict
          python3 tools/docs/check_rendered_mermaid.py --docs-dir docs --site-dir site

  formal-model:
    name: Formal model check (Dafny)
    if: github.event.action != 'labeled'
    # spec/dafny proves, unbounded and by induction, that serialise and deserialise round-trip and
    # that the read path is bounds-safe by construction. Re-verified on every change so the model
    # cannot rot. Needs only the Dafny toolchain.
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/opencyphal/toolshed:ts26.4.5
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assert the Dafny toolchain
        # Dafny's NuGet package ships no solver, so a `dafny` that launches proves nothing on its
        # own. `shell: bash` is required: a container job without it runs steps under sh, where the
        # array syntax below is a syntax error.
        shell: bash
        run: |
          set -uo pipefail
          missing=()
          for tool in dafny z3; do
            command -v "${tool}" >/dev/null 2>&1 || missing+=("${tool}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::toolshed image is missing: ${missing[*]}"
            exit 1
          fi
          dafny --version
          z3 --version

      - name: Verify CyphalSerdes
        run: dafny verify spec/dafny/CyphalSerdes.dfy

      - name: Verify BitLengthSet model
        run: dafny verify spec/dafny/BitLengthSet.dfy

      - name: Verify BitLengthSet bridge
        run: dafny verify spec/dafny/BitLengthBridge.dfy
