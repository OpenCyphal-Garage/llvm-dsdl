name: CI

# Full, unabridged test + report run for the core tools (dsdlc, dsdl-opt, dsdld)
# across every supported host platform and every generated-output language.
#
# The container jobs run INSIDE the project's own toolshed image
# (ghcr.io/opencyphal/toolshed:ts26.4.3 — the same image .devcontainer uses). That
# image is the single source of truth for the build environment: LLVM/MLIR 22,
# clang, cmake, ninja, the generated-output language toolchains, and Dafny with
# its solver all come from it. Nothing is installed per run; the setup action
# asserts the toolchains are present and fails loudly if one is missing, because
# the integration suite registers a language's tests only when its toolchain is
# found at configure time — so a silently incomplete image sheds whole lanes
# while still reporting green.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repository hygiene (identity + committed paths)
    # Deliberately not in the toolshed container and deliberately first: this needs nothing but
    # python3 and a checkout, finishes in seconds, and tells a contributor that a URL or a home
    # directory is wrong long before the full suite has finished pulling its image.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # No submodules: this checks what this repository commits, not what its dependencies do.
        uses: actions/checkout@v7

      - name: Check that every mention of where this project lives is current
        # The repository has moved before and moves again at v1.0. Everything that names the owner is
        # derived from project-identity.json, and this is what stops a hand-edit from drifting back.
        # It also fails on a committed /Users/<somebody>/ path, which is wrong for every other reader.
        run: python3 tools/repo_identity.py

  linux:
    name: Full suite (linux / toolshed)
    runs-on: ubuntu-26.04
    container:
      # toolshed + our LLVM prefix, built by the Toolchain workflow. The tag is
      # literal because a container image is resolved before any step could read
      # packaging/toolchain/{toolshed,llvm}.pin; if they disagree this fails at
      # container pull, which is loud.
      image: ghcr.io/opencyphal-garage/llvm-dsdl-ci:ts26.4.3-llvmorg-22.1.8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    env:
      LLVM_DIR: /opt/llvm-dsdl-toolchain/lib/cmake/llvm
      MLIR_DIR: /opt/llvm-dsdl-toolchain/lib/cmake/mlir
      CMAKE_PREFIX_PATH: /opt/llvm-dsdl-toolchain
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare toolchains
        uses: ./.github/actions/setup-language-toolchains

      - name: Provision peer DSDL compiler for corroboration (nunavut + pydsdl)
        # The differential parity lane compares our generated C against Nunavut as a
        # pinned PEER implementation — corroboration, not an oracle. The Cyphal
        # Specification is the truth and spec/dafny/CyphalSerdes.dfy is the
        # machine-checked oracle (see its Authority hierarchy); a mismatch here is an
        # investigation adjudicated by the spec, as likely a Nunavut defect as ours.
        # With the SHAs pinned, a newly appearing mismatch implicates our change
        # first, which is what makes this lane a useful blocking tripwire. The
        # harness consumes both repos as source trees via PYTHONPATH — nunavut
        # vendors Jinja2 and pydsdl has no runtime deps, so no pip install is
        # needed. Bump both SHAs only as a deliberate, adjudicated update.
        env:
          NUNAVUT_SHA: 37095abb9fac47f924a52500bf4cebe2256dcff5  # tag 3.0.1b1
          PYDSDL_SHA: a1506ce424589cc049b3fe4fece1e52626b55529   # pydsdl 1.23.0-dev
        run: |
          git clone --filter=blob:none https://github.com/OpenCyphal/nunavut.git .reference/nunavut
          git -C .reference/nunavut checkout --detach "${NUNAVUT_SHA}"
          git clone --filter=blob:none https://github.com/OpenCyphal/pydsdl.git .reference/pydsdl
          git -C .reference/pydsdl checkout --detach "${PYDSDL_SHA}"

      - name: Configure (ci preset)
        # LLVMDSDL_REPORT_GATE_JUNIT makes the parity/malformed/determinism report gates
        # BEHAVIORAL: a matrix cell is covered only if a matching test executed and passed
        # (consumed from the suite's --output-junit below), not merely registered by name.
        # LLVMDSDL_REQUIRE_DIFFERENTIAL_PARITY=ON turns a missing nunavut/pydsdl into a hard
        # configure error, so a green CI run can never mean the reference-parity lane was
        # silently skipped.
        run: |
          cmake --preset ci \
            -DLLVM_DIR="${LLVM_DIR}" -DMLIR_DIR="${MLIR_DIR}" \
            -DLLVMDSDL_REPORT_GATE_JUNIT="${GITHUB_WORKSPACE}/test-results/junit-linux.xml" \
            -DLLVMDSDL_NUNAVUT_REPO="${GITHUB_WORKSPACE}/.reference/nunavut" \
            -DLLVMDSDL_PYDSDL_REPO="${GITHUB_WORKSPACE}/.reference/pydsdl" \
            -DLLVMDSDL_REQUIRE_DIFFERENTIAL_PARITY=ON

      - name: Build (Debug)
        run: cmake --build --preset build-ci

      - name: Build Python runtime accelerator
        run: cmake --build build/matrix/ci --config Debug --target build-python-runtime-accelerator

      - name: Run full unabridged test suite
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/test-results"
          ctest --preset test-ci-full \
            --output-junit "${GITHUB_WORKSPACE}/test-results/junit-linux.xml"

      - name: Behavioural scorecard gates (convergence lint + parity/malformed/determinism pass-fail)
        # Runs after the suite so it can consume the executed JUnit results. `if: always()`
        # ensures the gate still runs (and can fail the job) even if an earlier test failed.
        if: always()
        run: cmake --build build/matrix/ci --config Debug --target release-blocking-report-gates

      - name: Generated docs (build the target the Docs workflow depends on)
        # Nothing under docs/ that is generated gets committed, so there is no staleness to police
        # here. What this step buys is a fast signal: the site is only publishable if this target
        # succeeds, and its checks -- the showroom's comment-width and DSDL-discovery rules, and the
        # llms.txt coverage rule that every page is either in the nav or declared unlisted -- are
        # cheap enough to be worth failing a PR on rather than a push to main.
        #
        # The report generators run twice on this job: once above as the behavioural release gate,
        # once here as page generation. They are python over an existing test tree, the second run
        # costs seconds, and it is what puts the gate's own numbers on the page.
        if: always()
        run: cmake --build build/matrix/ci --config Debug --target docs-generate

      - name: Build the docs site (strict)
        # The nav is the page map, and `--strict` is what makes that true: an unfiled page, a broken
        # cross-reference, or a nav entry with no page behind it fails here, on the PR, instead of
        # surfacing as a hole in the published site. A virtual environment because the image ships
        # its own mkdocs at distro versions and its Python is PEP 668 externally-managed.
        if: always()
        #
        # The mermaid check is separate because `--strict` cannot see that failure: the markdown is
        # valid and the page builds, but the diagram becomes a red error card in the reader's
        # browser. It asserts the diagram reaches the page in the shape vanilla mermaid can read.
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/pip install --quiet --upgrade pip
          .venv-docs/bin/pip install --quiet -r docs/requirements.txt
          .venv-docs/bin/mkdocs build --strict
          python3 tools/docs/check_rendered_mermaid.py --docs-dir docs --site-dir site

      - name: Collect reports
        if: always()
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/reports"
          [ -d build/matrix/ci/convergence ] && cp -R build/matrix/ci/convergence "${GITHUB_WORKSPACE}/reports/" || true

      # GitHub-only reporting: skipped under `act` (which sets ACT=true) so local
      # runs don't hit the GitHub API or need an artifact server.
      - name: Publish test results
        if: ${{ always() && !env.ACT }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "test-results/junit-linux.xml"
          check_name: "Test results (linux)"
          include_passed: true
          detailed_summary: true
          fail_on_failure: false

      - name: Upload JUnit results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-linux
          path: test-results/junit-linux.xml
          if-no-files-found: warn

      - name: Upload reports
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-linux
          path: reports/
          if-no-files-found: warn

  sanitizers:
    name: Native decoder sanitizers + fuzzing (linux / toolshed)
    # ASan/UBSan over the generated C/C++/Go decoders plus a coverage-guided
    # libFuzzer lane over the native deserializers on the real UAVCAN corpus.
    # Linux-only: threading the ASan runtime into a Go external link is only
    # reliable here, and macOS Apple-Silicon ASan startup is flaky. The lane is
    # bounded on PRs (short -runs) and runs deep on the weekly schedule cron.
    runs-on: ubuntu-26.04
    container:
      # toolshed + our LLVM prefix, built by the Toolchain workflow. The tag is
      # literal because a container image is resolved before any step could read
      # packaging/toolchain/{toolshed,llvm}.pin; if they disagree this fails at
      # container pull, which is loud.
      image: ghcr.io/opencyphal-garage/llvm-dsdl-ci:ts26.4.3-llvmorg-22.1.8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    env:
      LLVM_DIR: /opt/llvm-dsdl-toolchain/lib/cmake/llvm
      MLIR_DIR: /opt/llvm-dsdl-toolchain/lib/cmake/mlir
      CMAKE_PREFIX_PATH: /opt/llvm-dsdl-toolchain
      # The sanitizer + fuzz harnesses require Clang (-fsanitize=address,undefined
      # and compiler-rt libFuzzer); force it so the Clang-gated tests register and
      # the generated decoders are compiled with the sanitizer toolchain.
      #
      # Still the image's own Clang, not ours: our toolchain builds MLIR alone and
      # ships no compiler, and a compiler is not what this project stopped taking
      # from a distribution. LLVM_DIR above is what decides which LLVM is linked;
      # this decides only what does the compiling.
      CC: /usr/lib/llvm-22/bin/clang
      CXX: /usr/lib/llvm-22/bin/clang++
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare toolchains
        # Go is needed for the C/Go sanitized parity variant; the MLIR dev libs
        # are needed to build dsdlc.
        uses: ./.github/actions/setup-language-toolchains

      - name: Configure (ci-asan preset)
        # A short fuzz budget on PRs keeps the lane fast; the weekly schedule cron
        # runs a deep budget. libFuzzer support is auto-probed by the harness,
        # which falls back to an ASan/UBSan corpus replay if it is absent.
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            FUZZ_RUNS=4000000
          else
            FUZZ_RUNS=40000
          fi
          cmake --preset ci-asan \
            -DLLVM_DIR="${LLVM_DIR}" -DMLIR_DIR="${MLIR_DIR}" \
            -DLLVMDSDL_NATIVE_DECODER_FUZZ_RUNS="${FUZZ_RUNS}"

      - name: Build dsdlc (sanitizer toolchain)
        # The sanitizer/fuzz tests are CMake scripts that only drive dsdlc; they
        # compile the generated decoders themselves under sanitizers, so only
        # dsdlc needs building here.
        run: cmake --build build/matrix/ci-asan --config Debug --target dsdlc

      - name: Run sanitizer + native-decoder fuzz lane
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/test-results"
          ctest --preset test-ci-asan-sanitizer \
            --output-junit "${GITHUB_WORKSPACE}/test-results/junit-sanitizers.xml"

      - name: Collect fuzz reproducers
        # Any crash/leak/timeout reproducer libFuzzer saved becomes a CI artifact
        # so a maintainer can add it to test/fuzz/corpus/native_decoder/.
        if: always()
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/fuzz-artifacts"
          find build/matrix/ci-asan -type d -name artifacts -path '*native-decoder-fuzz*' \
            -exec cp -R {}/. "${GITHUB_WORKSPACE}/fuzz-artifacts/" \; 2>/dev/null || true

      - name: Publish test results
        if: ${{ always() && !env.ACT }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "test-results/junit-sanitizers.xml"
          check_name: "Test results (sanitizers)"
          include_passed: true
          detailed_summary: true
          fail_on_failure: false

      - name: Upload fuzz reproducers
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-reproducers
          path: fuzz-artifacts/
          if-no-files-found: ignore

  formal-model:
    name: Formal model check (Dafny)
    # spec/dafny/CyphalSerdes.dfy is the normative oracle for the emit-order verifier:
    # it PROVES (unbounded, by induction) that serialize/deserialize round-trip and that
    # the read path is bounds-safe by construction, and defines the accepted op orderings
    # the B1 verifier checks each generated backend against. Re-verified on every change
    # so the oracle can't rot. Needs only the Dafny toolchain — independent of the
    # LLVM/MLIR build matrix, so it is fast and cannot be skipped by a toolchain gap in
    # the heavy lanes.
    runs-on: ubuntu-26.04
    # Dafny and its solver come from the toolshed image rather than being fetched
    # per run.
    container:
      # toolshed + our LLVM prefix, built by the Toolchain workflow. The tag is
      # literal because a container image is resolved before any step could read
      # packaging/toolchain/{toolshed,llvm}.pin; if they disagree this fails at
      # container pull, which is loud.
      image: ghcr.io/opencyphal-garage/llvm-dsdl-ci:ts26.4.3-llvmorg-22.1.8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assert the Dafny toolchain
        # Deliberately not the shared toolchain action: this lane is independent of
        # the LLVM/MLIR build matrix and must not be taken down by a Go or
        # TypeScript gap. It needs exactly two things, and Dafny's NuGet package
        # ships no solver, so a `dafny` that launches proves nothing on its own.
        #
        # `shell: bash` is required, not decorative: a container job without it
        # runs steps under sh, where the array syntax below is a syntax error.
        shell: bash
        run: |
          set -uo pipefail
          missing=()
          for tool in dafny z3; do
            command -v "${tool}" >/dev/null 2>&1 || missing+=("${tool}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::toolshed image is missing: ${missing[*]} — these belong in the image"
            exit 1
          fi
          dafny --version
          z3 --version

      - name: Verify CyphalSerdes
        # `dafny verify` exits non-zero on any failed proof obligation, so a broken model
        # (or a regression to the accepted op-orderings) fails the job.
        run: dafny verify spec/dafny/CyphalSerdes.dfy

  showroom-recipes:
    name: Showroom build recipes (linux / toolshed)
    # One (language, build system) pair per recipe: generate with dsdlc, compile the output, run a
    # round-trip program. This lane is not about codegen correctness -- test/lit and the integration
    # suite own that -- it is about whether the recipes published in the manual still work.
    #
    # Deliberately independent of the `linux` job rather than needing it: it builds dsdlc alone,
    # which is a fraction of the full suite, so a broken integration recipe is reported in minutes
    # instead of after the two-hour lane. It carries its own checkout for the same reason.
    #
    # A recipe whose toolchain is absent SKIPS. That is correct for a developer machine and dangerous
    # here, because an image that quietly lost a toolchain would shed recipes while still reporting
    # green -- so --require names the recipes that must never skip, and a skip among them fails the
    # job. Keep that list growing as recipes land.
    runs-on: ubuntu-26.04
    container:
      # toolshed + our LLVM prefix, built by the Toolchain workflow. The tag is
      # literal because a container image is resolved before any step could read
      # packaging/toolchain/{toolshed,llvm}.pin; if they disagree this fails at
      # container pull, which is loud.
      image: ghcr.io/opencyphal-garage/llvm-dsdl-ci:ts26.4.3-llvmorg-22.1.8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    env:
      LLVM_DIR: /opt/llvm-dsdl-toolchain/lib/cmake/llvm
      MLIR_DIR: /opt/llvm-dsdl-toolchain/lib/cmake/mlir
      CMAKE_PREFIX_PATH: /opt/llvm-dsdl-toolchain
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check the recipe invariant (build wiring only)
        # Needs no toolchain and no compiler, so it runs first and fails fast: a recipe that grew its
        # own round-trip source has stopped being comparable with its neighbours, which is the whole
        # point of the matrix.
        run: python3 examples/showroom/run_recipe.py --check-invariant

      - name: Configure (ci preset)
        # The install prefix is fixed at configure time because the install happens through the
        # project's own `install-bin` target below, which takes no --prefix.
        run: |
          cmake --preset ci \
            -DLLVM_DIR="${LLVM_DIR}" \
            -DMLIR_DIR="${MLIR_DIR}" \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/llvm-dsdl-prefix"

      - name: Install llvm-dsdl to a private prefix
        # Recipes that call find_package(llvm-dsdl) need an install tree, not a build tree: the package
        # config locates dsdlc relative to its own installed location, so configuring against the
        # build directory would exercise a path no user ever takes. This step is therefore also the
        # selftest for the CMake package -- if the config is broken for a user, c-cmake fails here.
        #
        # `install-bin` rather than `--target dsdlc` and a hand-written `cmake --install`, because
        # both halves of that are easy to get subtly wrong and neither fails until here. The `bin`
        # component installs every tool in LLVMDSDL_INSTALLABLE_TOOLS, not just dsdlc, so building
        # dsdlc alone leaves the install looking for a dsdl-opt nobody built; and `ci` is a Ninja
        # Multi-Config preset, so an install with no --config silently resolves to
        # CMAKE_DEFAULT_BUILD_TYPE (RelWithDebInfo, from `base`) while `build-ci` only ever builds
        # Debug. The target settles both: it depends on the tool list, so it cannot drift as tools
        # are added, and it passes --config $<CONFIG> itself.
        run: |
          cmake --build --preset build-ci --target install-bin
          test -x "${RUNNER_TEMP}/llvm-dsdl-prefix/bin/dsdlc"
          test -f "${RUNNER_TEMP}/llvm-dsdl-prefix/lib/cmake/llvm-dsdl/llvm-dsdlConfig.cmake"
          test -f "${RUNNER_TEMP}/llvm-dsdl-prefix/share/rules_dsdl/repositories.bzl"

      - name: Install pnpm
        # pnpm is the one toolchain in the matrix the image does not ship, so the job provisions it.
        #
        # Not `corepack enable pnpm`, which is the obvious way and is worse than failing: the image's
        # corepack is 0.24.0 against node 22, old enough that the shim it installs dies on startup
        # with ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING. That still puts a `pnpm` on PATH, so the
        # recipe's toolchain probe is satisfied and the recipe runs and fails, rather than skipping.
        # Installing the real package sidesteps corepack entirely.
        run: npm install -g pnpm

      - name: Run the recipes
        # --require names the recipes that must never skip. Everything in it is backed by a toolchain
        # the toolshed image ships, so a skip there means the image lost something and the matrix is
        # quietly shedding coverage -- which must fail rather than report green. Extend the list as
        # each remaining core recipe lands: py-setuptools.
        #
        # c-bazel joined the list in ts26.4.3, which carries bazel; the recipe pins the same 9.2.0 the
        # image pre-warms, so it neither downloads a compiler nor drifts off it. ts-pnpm is in the
        # list too now that the step above installs pnpm outright: provisioning it is no longer
        # allowed to fail quietly, so a skip is a real loss of coverage like any other.
        #
        # The installed dsdlc, not one fished out of the build tree. Under a multi-config generator
        # the build tree can hold several, and `find | head -1` would pick between them by accident;
        # the prefix holds exactly one, and it is the same binary find_package(llvm-dsdl) resolves
        # for the recipes that go through the package config -- so both flags below name one build.
        run: |
          python3 examples/showroom/run_recipe.py \
            --dsdlc "${RUNNER_TEMP}/llvm-dsdl-prefix/bin/dsdlc" \
            --prefix "${RUNNER_TEMP}/llvm-dsdl-prefix" \
            --work "${RUNNER_TEMP}/showroom-recipes" \
            --json "${GITHUB_WORKSPACE}/showroom-recipe-results.json" \
            --markdown "${GITHUB_STEP_SUMMARY}" \
            --require "c-bazel,c-cmake,c-cmake-ninja-multi,c-make,rust-cargo,go-modules,ts-npm,ts-pnpm,py-setuptools,py-hatchling,py-uv-build,py-poetry,py-flit"

      - name: Upload results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: showroom-recipe-results
          path: showroom-recipe-results.json
          if-no-files-found: ignore

      - name: Regenerate the documentation pages
        # Cheap, needs no compiler, and proves the generator still runs against the recipes as they
        # actually are -- a recipe.json the renderer chokes on should fail here, not at publish time.
        run: python3 tools/showroom/recipes_index.py
