name: Docs

# The site is built inside the project's toolshed image (the same one CI and .devcontainer use) so
# that this job can compile dsdlc and generate the produced pages itself: docs/showroom (the
# compiler's own output), the guarantee matrices (the report generators' output), and
# llms.txt/llms-full.txt (derived from the nav). Generating them here is what lets them stay out of
# the repository instead of being checked in and policed for staleness.
#
# The cost is small: `docs-generate` pulls in 62 translation units -- dsdlc and its libraries, none
# of the tests or the other tools -- which is a fraction of the full build. Everything downstream of
# that is python.
#
# There is deliberately no `paths:` filter. Once the showroom is generated rather than committed, the
# site depends on the backends as much as on docs/, so any change to main can change what is
# published, and a filter that tried to enumerate that would be wrong the first time a file moved.
#
# BUILDING AND PUBLISHING ARE SEPARATE HERE
#
# Every push to main builds the site and publishes nothing. What is served on GitHub Pages is the
# last release, so a reader following the manual is reading instructions for a version they can
# actually download -- main routinely documents tools and flags that no released binary has.
#
# Publishing happens on `release: published`, which is the moment a maintainer publishes the draft
# that release.yml left behind, and the checkout for that event is the tag rather than main. So the
# site is built from the released source, not from whatever main happens to be at the time.
#
# Prereleases are deliberately not excluded: every release this project has cut so far is one, and
# `!github.event.release.prerelease` would mean the site never updates. Add it if that changes.
#
# The main-push build is therefore a pure check, and it is the one that has to stay green -- it is
# what stops a release-day publish from being the first time anyone discovered the site does not
# build.

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Deploy to GitHub Pages (patches the published site between releases)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Two groups rather than one. Superseding a build-only run is free; superseding a publishing one
  # is not -- a release deploy cancelled halfway leaves Pages serving the previous version with no
  # sign that anything failed, and the release event cannot be replayed by pushing again, so
  # recovering it needs a manual dispatch.
  #
  # A single shared group would do exactly that: `cancel-in-progress` is evaluated for the arriving
  # run, so an ordinary push to main landing during a release publish would cancel the publish.
  # Splitting the group is what actually keeps them out of each other's way; the flag below then
  # only decides whether pushes supersede each other, which they should.
  group: docs-${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && 'publish' || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/opencyphal/toolshed:ts26.4.3
    timeout-minutes: 30
    env:
      LLVM_DIR: /usr/lib/llvm-22/lib/cmake/llvm
      MLIR_DIR: /usr/lib/llvm-22/lib/cmake/mlir
    steps:
      - name: Checkout (with submodules)
        # Submodules are required, despite every reference to submodules/public_regulated_data_types
        # being EXISTS-guarded. The guard is exactly the problem: without the corpus, the 58
        # `llvmdsdl-uavcan-*` tests are never registered, and this job generates the guarantee
        # matrices in STRUCTURAL mode -- coverage inferred from registered ctest names. Every
        # cpp/rust/go cell in the parity matrix is corpus-backed, so a submodule-less checkout does
        # not merely fail the gate (score 12 against a minimum of 100); it would publish a parity
        # page claiming those three backends have no array, union, delimited or service coverage.
        # The showroom itself does resolve its uavcan dependencies from dsdlc's embedded catalog --
        # that part of the old comment was right, it just was not the whole dependency.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure Pages
        # Skipped under act (which sets ACT=true), here and on the two steps below: these three talk
        # to the GitHub Pages and artifact APIs, which no local runner has, and none of them affect
        # what is built -- mkdocs takes its site_url from mkdocs.yml, not from this action's output.
        # Guarding them is what lets `act push -W .github/workflows/docs.yml` answer the only
        # question worth asking locally: does the site build. See CONTRIBUTING.md.
        if: ${{ !env.ACT }}
        uses: actions/configure-pages@v6

      - name: Configure
        run: cmake --preset ci -DLLVM_DIR="${LLVM_DIR}" -DMLIR_DIR="${MLIR_DIR}"

      - name: Generate the pages that are produced rather than written
        # `docs-generate` covers all three kinds: the showroom (compiler output), the guarantee
        # matrices (report-generator output), and llms.txt/llms-full.txt (derived from the nav).
        #
        # Debug because this dsdlc only has to run over 24 definitions; what matters is how fast it
        # compiles, not how fast it runs.
        #
        # The matrices come out in STRUCTURAL mode here -- coverage inferred from registered test
        # names -- because this job does not run the suite. Each page says so in its own banner. The
        # behavioral run, which consumes executed pass/fail, is a release gate in the CI workflow.
        run: cmake --build build/matrix/ci --config Debug --target docs-generate

      - name: Install the pinned docs toolchain
        # A virtual environment for two reasons: the image ships its own mkdocs at distro versions,
        # and its Python is PEP 668 externally-managed, so installing into it is refused outright.
        # The pins in docs/requirements.txt are load-bearing -- see the Pygments note in that file.
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/pip install --upgrade pip
          .venv-docs/bin/pip install -r docs/requirements.txt

      - name: Build docs site
        run: .venv-docs/bin/mkdocs build --strict

      - name: Check that diagrams reach the page in a renderable shape
        # `--strict` cannot see this one: the markdown is valid and the page builds, but the diagram
        # becomes a red "Syntax error in text" card once mermaid runs in the reader's browser.
        # Checked here as well as in CI so that nothing publishes a page that renders an error.
        run: python3 tools/docs/check_rendered_mermaid.py --docs-dir docs --site-dir site

      - name: Upload Pages artifact
        # Only on runs that will deploy. The condition is repeated on the deploy job below rather
        # than shared, because a job-level `if` cannot read a workflow `env`, which is the same
        # limitation the deploy step's own comment records.
        if: ${{ !env.ACT && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # A push to main never reaches here: it builds, and that is the whole point of the split.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        # Guarded on the step rather than the job: a job-level `if` cannot read the env context, so
        # `!env.ACT` there would be a workflow syntax error on GitHub. This way the whole workflow
        # runs under act with deploy reduced to a no-op.
        if: ${{ !env.ACT }}
        id: deployment
        uses: actions/deploy-pages@v5
