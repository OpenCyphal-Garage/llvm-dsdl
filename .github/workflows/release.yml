name: Release

# Attaches the release artifacts to a draft GitHub Release.
#
# The building and verifying lives in release-build.yml, which CI also calls on
# a `release-ci` pull request. This workflow is the half that needs a write
# token: it runs that shared lane first, then publishes what it produced.
#
# The split is not cosmetic. A called workflow's job permissions are checked
# against the caller's grant at parse time, so keeping `publish` here is what
# lets CI call the same build jobs with a read-only token.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, but do not create a release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: "release-${{ github.ref }}"
  # Never cancel: interrupting a run mid-publish would leave a partly-populated
  # draft release behind.
  cancel-in-progress: false

jobs:
  verify:
    name: Build and verify
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
      packages: read        # pull the published toolchain image

  publish:
    name: Publish release
    needs: verify
    # A tag always publishes. A manual run publishes only when asked to.
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # provenance attestation
      attestations: write
    steps:
      # Two steps rather than one brace pattern, and into per-artifact
      # subdirectories rather than merged: every build job writes its own
      # SHA256SUMS, and merging would silently leave one overwriting the others.
      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: staging

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: staging

      - name: Combine artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find staging -type f ! -name SHA256SUMS -exec cp {} dist/ \;
          # One checksum file covering everything, rebuilt from the artifacts
          # themselves rather than concatenated, so it cannot disagree with what
          # is actually attached.
          cd dist && sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.gz

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.verify.outputs.version) }}
          name: llvm-dsdl ${{ needs.verify.outputs.version }}
          draft: true
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          body: |
            ## Ubuntu 22.04, 24.04, or 26.04

            Pick the package matching your architecture (`dpkg --print-architecture`):

            ```
            sudo apt install ./llvm-dsdl_${{ needs.verify.outputs.version }}_amd64.deb
            sudo apt install ./llvm-dsdl_${{ needs.verify.outputs.version }}_arm64.deb
            ```

            `llvm-dsdl-dev` is also attached, for linking against the frontend,
            MLIR dialect, and emitter libraries.

            ## macOS 15 or newer, Apple silicon or Intel

            Pick the tarball matching your architecture — `uname -m` reports
            `arm64` on Apple silicon and `x86_64` on Intel, which takes the
            `darwin-amd64` asset. Download with `curl` rather than through a
            browser, then extract:

            ```
            arch=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo amd64)
            curl -fLO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.verify.outputs.version) }}/llvm-dsdl-${{ needs.verify.outputs.version }}-darwin-$arch.tar.gz
            tar -xzf llvm-dsdl-${{ needs.verify.outputs.version }}-darwin-$arch.tar.gz
            ./llvm-dsdl-${{ needs.verify.outputs.version }}-darwin-$arch/bin/dsdlc --version
            ```

            The binaries are ad-hoc signed rather than notarised, so macOS refuses
            to run them if they carry the quarantine attribute. A browser attaches
            that attribute to the downloaded archive, and `tar` copies it onto
            every extracted file — so if you downloaded through a browser, or have
            already seen "Apple could not verify ... is free of malware", clear it
            after extracting:

            ```
            xattr -d -r com.apple.quarantine llvm-dsdl-${{ needs.verify.outputs.version }}-darwin-$arch
            ```

            Fetching with `curl` avoids the attribute in the first place, which is
            why it is the first step above. Move the extracted directory wherever
            you like — it is relocatable — and add its `bin/` to your `PATH`.

            ## Both platforms

            No repository or package manager to configure: each package bundles the
            LLVM 22 runtime it needs, because neither Ubuntu nor a stock macOS
            carries it. Everything else comes from the platform.

            Verify downloads against `SHA256SUMS`, or check build provenance with
            `gh attestation verify <file> --repo ${{ github.repository }}`.
